server:
  port: 8080

spring:
  application:
    name: labapp-springboot
  task:
    scheduling:
      pool:
        size: 4

app:
  datasource:
    # Writes and read-modify-write transactions: HAProxy -> MySQL Router 6446 -> PRIMARY
    writer:
      pool-name: springboot-writer
      jdbc-url: jdbc:mysql://${DB_HOST:mysql-router}:6446/labapp_springboot
      username: ${DB_USER:${LABAPP_SPRINGBOOT_DB_USER}}
      password: ${DB_PASSWORD:${LABAPP_SPRINGBOOT_DB_PASSWORD}}
      read-only: false
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000          # ms to wait for a free connection from the pool
      validation-timeout: 1000          # ms for the liveness check of a pooled connection
      keepalive-time: 30000             # ping idle connections, so dead ones are found early
      idle-timeout: 60000               # close idle connections above minimum-idle after 60 s
      max-lifetime: 300000              # recycle every 5 min (must stay below MySQL wait_timeout)
      initialization-fail-timeout: -1   # start the app even if the cluster is not reachable yet
      data-source-properties:           # Connector/J settings
        connectTimeout: 3000            # ms to open a TCP connection
        socketTimeout: 15000            # ms max per network read: never hang on a dead node
        tcpKeepAlive: true
        cachePrepStmts: true
        useServerPrepStmts: false
        connectionAttributes: "program_name:labapp-springboot,pool:writer"   # visible in performance_schema.session_connect_attrs

    # Read-only transactions: HAProxy -> MySQL Router 6447 -> a SECONDARY
    reader:
      pool-name: springboot-reader
      jdbc-url: jdbc:mysql://${DB_HOST:mysql-router}:6447/labapp_springboot
      username: ${DB_USER:${LABAPP_SPRINGBOOT_DB_USER}}
      password: ${DB_PASSWORD:${LABAPP_SPRINGBOOT_DB_PASSWORD}}
      read-only: true
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
      keepalive-time: 30000
      idle-timeout: 60000
      max-lifetime: 300000
      initialization-fail-timeout: -1
      data-source-properties:
        connectTimeout: 3000
        socketTimeout: 15000
        tcpKeepAlive: true
        cachePrepStmts: true
        useServerPrepStmts: false
        connectionAttributes: "program_name:labapp-springboot,pool:reader"
  tx:
    timeout-seconds: 10                 # TransactionTemplate timeout (statement timeout)
  retry:
    max-attempts: 8                     # waits 200 ms, 400, 800, 1.6 s, then 2 s each: covers a 6-10 s failover
  load:
    enabled: ${LOAD_ENABLED:false}      # or: curl -X POST localhost:8080/load/start
    delay-ms: 200                       # pause between load iterations
  probe:
    interval-ms: 1000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %-12logger{0} %msg%n"
  level:
    com.zaxxer.hikari.pool.HikariPool: INFO
    load: INFO
    in.mytechbytes.mysqlha.labapp.configs.Retry: WARN
