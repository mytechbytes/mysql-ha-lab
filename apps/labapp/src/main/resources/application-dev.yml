app:
  datasource:
    writer:
      jdbc-url: jdbc:mysql://localhost:6446/app
      maximum-pool-size: 5
    reader:
      jdbc-url: jdbc:mysql://localhost:6447/app
      maximum-pool-size: 5
  tx:
    timeout-seconds: 10
    retry:
      max-attempts: 8
  load:
    enabled: false
server:
  port: 8081

logging:
  level:
    lab.mysqlha: DEBUG
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    com.zaxxer.hikari.pool.HikariPool: DEBUG

spring:
  config:
    import: "optional:file:../../.env[.properties]"
  devtools:
    restart:
      enabled: true
