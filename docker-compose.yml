x-mysql: &mysql
  image: mysql:8.4
  restart: unless-stopped
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    MYSQL_ROOT_HOST: "%"
  networks: [cluster]
x-router: &router
  image: container-registry.oracle.com/mysql/community-router:8.4
  restart: unless-stopped
  depends_on:
    cluster-init:
      condition: service_completed_successfully
  environment:
    MYSQL_HOST: mysql1
    MYSQL_PORT: 3306
    MYSQL_USER: ${CLUSTER_ADMIN}
    MYSQL_PASSWORD: ${CLUSTER_ADMIN_PASSWORD}
    MYSQL_INNODB_CLUSTER_MEMBERS: 3
  networks: [cluster]
x-exporter: &exporter
  image: prom/mysqld-exporter:v0.20.0
  profiles: [monitoring]
  restart: unless-stopped
  depends_on:
    monitoring-init:
      condition: service_completed_successfully
  environment:
    MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_PASSWORD}
  networks: [cluster]

services:
  mysql1:
    <<: *mysql
    container_name: mysql1
    hostname: mysql1
    volumes:
      - mysql1:/var/lib/mysql
      - ./conf/common.cnf:/etc/mysql/conf.d/01-common.cnf:ro
      - ./conf/mysql1.cnf:/etc/mysql/conf.d/02-node.cnf:ro
  mysql2:
    <<: *mysql
    container_name: mysql2
    hostname: mysql2
    volumes:
      - mysql2:/var/lib/mysql
      - ./conf/common.cnf:/etc/mysql/conf.d/01-common.cnf:ro
      - ./conf/mysql2.cnf:/etc/mysql/conf.d/02-node.cnf:ro
  mysql3:
    <<: *mysql
    container_name: mysql3
    hostname: mysql3
    volumes:
      - mysql3:/var/lib/mysql
      - ./conf/common.cnf:/etc/mysql/conf.d/01-common.cnf:ro
      - ./conf/mysql3.cnf:/etc/mysql/conf.d/02-node.cnf:ro
  cluster-init:
    image: mysql:8.4
    container_name: cluster-init
    restart: "no"
    depends_on: [mysql1, mysql2, mysql3]
    entrypoint: ["bash", "/scripts/init-cluster.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CLUSTER_ADMIN: ${CLUSTER_ADMIN}
      CLUSTER_ADMIN_PASSWORD: ${CLUSTER_ADMIN_PASSWORD}
      CLUSTER_NAME: ${CLUSTER_NAME}
    volumes:
      - ./scripts:/scripts:ro
    networks: [cluster]
  router1:
    <<: *router
    container_name: mysql-router1
    hostname: mysql-router1
  router2:
    <<: *router
    container_name: mysql-router2
    hostname: mysql-router2
  router-lb:
    image: haproxy:3.0
    container_name: mysql-router
    hostname: mysql-router
    restart: unless-stopped
    depends_on: [router1, router2]
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "6446:6446"
      - "6447:6447"
      - "6450:6450"
      - "8404:8404"
    networks: [cluster]
  monitoring-init:
    image: mysql:8.4
    container_name: monitoring-init
    profiles: [monitoring]
    restart: on-failure
    depends_on: [router-lb]
    entrypoint: ['bash', '/monitoring/init-exporter-user.sh']
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EXPORTER_USER: ${EXPORTER_USER}
      EXPORTER_PASSWORD: ${EXPORTER_PASSWORD}
    volumes:
      - ./monitoring:/monitoring:ro
    networks: [cluster]
  exporter-mysql1:
    <<: *exporter
    container_name: exporter-mysql1
    command:
      - --mysqld.address=mysql1:3306
      - --mysqld.username=${EXPORTER_USER}
      - --collect.perf_schema.replication_group_members
      - --collect.perf_schema.replication_group_member_stats
  exporter-mysql2:
    <<: *exporter
    container_name: exporter-mysql2
    command:
      - --mysqld.address=mysql2:3306
      - --mysqld.username=${EXPORTER_USER}
      - --collect.perf_schema.replication_group_members
      - --collect.perf_schema.replication_group_member_stats
  exporter-mysql3:
    <<: *exporter
    container_name: exporter-mysql3
    command:
      - --mysqld.address=mysql3:3306
      - --mysqld.username=${EXPORTER_USER}
      - --collect.perf_schema.replication_group_members
      - --collect.perf_schema.replication_group_member_stats
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: prometheus
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [cluster]
  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    profiles: [monitoring]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mysql-cluster.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [cluster]
networks:
  cluster:
    name: ${NETWORK_CLUSTER_NAME}
    attachable: true
volumes:
  mysql1: {}
  mysql2: {}
  mysql3: {}
  prometheus_data: {}
  grafana_data: {}
