global
    log stdout format raw local0

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h

# Docker's DNS: lets HAProxy start even if a router is down
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend mysql_rw
    bind :6446
    default_backend routers_rw

frontend mysql_ro
    bind :6447
    default_backend routers_ro

frontend mysql_rwsplit
    bind :6450
    default_backend routers_rwsplit

backend routers_rw
    balance leastconn
    default-server check inter 1s fall 2 rise 1 resolvers docker init-addr last,libc,none on-marked-down shutdown-sessions
    server router1 mysql-router1:6446
    server router2 mysql-router2:6446

backend routers_ro
    balance leastconn
    default-server check inter 1s fall 2 rise 1 resolvers docker init-addr last,libc,none on-marked-down shutdown-sessions
    server router1 mysql-router1:6447
    server router2 mysql-router2:6447

backend routers_rwsplit
    balance leastconn
    default-server check inter 1s fall 2 rise 1 resolvers docker init-addr last,libc,none on-marked-down shutdown-sessions
    server router1 mysql-router1:6450
    server router2 mysql-router2:6450

frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
    http-request use-service prometheus-exporter if { path /metrics }
