global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: mysql
    static_configs:
      - targets: ["exporter-mysql1:9104"]
        labels: { node: mysql1 }
      - targets: ["exporter-mysql2:9104"]
        labels: { node: mysql2 }
      - targets: ["exporter-mysql3:9104"]
        labels: { node: mysql3 }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: haproxy
    static_configs:
      - targets: ["mysql-router:8404"]
  # App running on the Mac in dev mode instead? Use host.docker.internal:8081 (Spring) / :8091 (Go).
  - job_name: labapp-springboot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["labapp-springboot:8080"]

  - job_name: labapp-go
    metrics_path: /metrics
    static_configs:
      - targets: ["labapp-go:8080"]
