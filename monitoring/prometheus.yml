global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: mysql
    static_configs:
      - targets: ["exporter-mysql1:9104"]
        labels: { node: mysql1 }
      - targets: ["exporter-mysql2:9104"]
        labels: { node: mysql2 }
      - targets: ["exporter-mysql3:9104"]
        labels: { node: mysql3 }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: haproxy
    static_configs:
      - targets: ["mysql-router:8404"]

  # Lab apps (Lesson 10). Each app has a Docker and a dev-mode target; whichever is not running shows DOWN in Status -> Targets.
  - job_name: labapp-springboot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["labapp-springboot:8080"]        # in Docker (--profile app-springboot)
        labels: { mode: docker }
      - targets: ["host.docker.internal:8081"]     # dev mode on the Mac (mvn spring-boot:run -Dspring-boot.run.profiles=dev)
        labels: { mode: dev }

  - job_name: labapp-go
    metrics_path: /metrics
    static_configs:
      - targets: ["labapp-go:8080"]                # in Docker (--profile app-go)
        labels: { mode: docker }
      - targets: ["host.docker.internal:8091"]     # dev mode on the Mac
        labels: { mode: dev }
